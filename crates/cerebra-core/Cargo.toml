[package]
name = "cerebra-core"
description = "Cerebra's knowledge engine: Obsidian-compatible notes, links, graph and search"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
age = "0.12.1"
ammonia = "4.2.5"
base64 = "0.23.1"
comrak = { version = "1.1.0", default-features = false }
pdf-extract = "0.12.1"
regex = "1.13.2"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
hex = "0.4.3"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.1"
thiserror = "2.0.21"
walkdir = "2.5.1"
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3.27.0"

# Local AI models through ONNX Runtime: OCR (PaddleOCR PP-OCRv6) and search by meaning
# (fastembed). ONNX Runtime has no prebuilt library for Intel Macs, so there Cerebra works
# without them (keyword search only, no OCR).
[target.'cfg(not(all(target_os = "macos", target_arch = "x86_64")))'.dependencies]
oar-ocr = "0.11.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
lopdf = "0.42"
fastembed = { version = "7.8.0", default-features = false, features = ["onnx", "fancy-regex"] }

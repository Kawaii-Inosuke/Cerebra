[package]
name = "cerebra-app"
description = "Cerebra desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "cerebra_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
cerebra-core = { path = "../crates/cerebra-core" }
dirs = "7.0.0"
hex = "0.4.3"
keyring = { version = "4.2.0" }
notify = "8"
notify-debouncer-mini = "0.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tauri = { version = "2.12.7", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
toml_edit = "0.23"
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
tempfile = "3.27.0"

# The Microsoft Store version asks the Store for its updates (Windows.Services.Store).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Services_Store", "Foundation", "Foundation_Collections", "ApplicationModel", "Win32_Foundation", "Win32_UI_Shell"] }

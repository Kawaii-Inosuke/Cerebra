[workspace]
resolver = "2"
members = ["crates/cerebra-core", "crates/cerebra-cli", "src-tauri"]
default-members = ["crates/cerebra-core", "crates/cerebra-cli"]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["Cerebra contributors"]
publish = false

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 2

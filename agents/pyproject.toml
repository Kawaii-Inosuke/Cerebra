[project]
name = "cerebra-agents"
version = "0.1.0"
description = "Cerebra's background agents: connect notes with Strands Agents over a stdio JSON-RPC sidecar."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "strands-agents[gemini,openai,anthropic,ollama,mistral]>=1.67",
    "mcp",
    "pydantic>=2",
]

[project.scripts]
cerebra-agents = "cerebra_agents.main:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "pyinstaller",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cerebra_agents"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM105"]
